<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaviGoo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            color: #1a73e8;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #5f6368;
            margin-bottom: 20px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }
        .btn-primary {
            background-color: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #1557b0;
        }
        .btn-secondary {
            background-color: #f1f3f4;
            color: #3c4043;
        }
        .btn-secondary:hover {
            background-color: #e8eaed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NaviGoo</h1>
        <p>Welcome to the NaviGoo repository page! This project handles IMU log processing, machine learning training, and navigation analysis.</p>
        
        <p>Since the core application runs via Python, check out the source code directly on GitHub or run the app locally.</p>

        <div class="btn-group">
            <a href="https://github.com/akshaymede/NaviGoo" class="btn btn-primary" target="_blank">View on GitHub</a>
            <!-- Replace the href below if you deploy app.py on Streamlit Cloud or Hugging Face -->
            <a href="https://github.com/akshaymede/NaviGoo/blob/main/app.py" class="btn btn-secondary" target="_blank">View app.py</a>
        </div>
    </div>

</body>
</html>
